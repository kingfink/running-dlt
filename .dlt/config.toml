# Non-secret dlt config. Real secrets live in .dlt/secrets.toml (gitignored)
# or in environment variables (production).

[runtime]
log_level = "INFO"

[destination.bigquery]
location = "US"

[destination.motherduck]
# Top-level MotherDuck database. Per-pipeline `dataset_name` is the schema
# inside it, so this can host multiple datasets (e.g. raw.strava, raw.foo).
database = "raw"
