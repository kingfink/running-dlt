[project]
name = "running-dlt"
version = "0.1.0"
description = "Strava activity sync to BigQuery + MotherDuck via dlt, scheduled on Modal."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dlt[bigquery,motherduck]>=1.5.0",
    "tailor-made-dlt-sources @ git+https://github.com/kingfink/dlt-sources@v0.1.0",
    "modal>=0.64",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "responses>=0.25",
    "ruff>=0.6",
]

[tool.uv]
package = true

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["strava_dlt"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
